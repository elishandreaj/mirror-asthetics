# Render Blueprint – deploys the website as one web service.
# The database is external (Neon free plan) – paste its URL as DATABASE_URL.
# Free setup guide: docs/DEPLOY-FREE.md
services:
  - type: web
    name: mirror-aesthetics
    runtime: node
    plan: free               # change to "starter" later for always-on, no-sleep hosting
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Manila
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_PATH         # private staff dashboard address, e.g. mirror-staff-7Q2
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BREVO_API_KEY      # free plan blocks SMTP ports, so email goes through Brevo's API
        sync: false
      - key: MAIL_FROM
        sync: false
